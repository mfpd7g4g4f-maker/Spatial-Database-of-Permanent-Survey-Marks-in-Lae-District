<script>
var map=L.map('map',{zoomControl:false,maxZoom:28,minZoom:1});
var hash=new L.Hash(map);
map.attributionControl.setPrefix('<a href="https://github.com/qgis2web/qgis2web" target="_blank">qgis2web</a> &middot; <a href="https://leafletjs.com" title="A JS library for interactive maps">Leaflet</a> &middot; <a href="https://qgis.org">QGIS</a>');
var autolinker=new Autolinker({truncate:{length:30,location:'smart'}});

function removeEmptyRowsFromPopupContent(content,feature){
var tempDiv=document.createElement('div');
tempDiv.innerHTML=content;
var rows=tempDiv.querySelectorAll('tr');
for(var i=0;i<rows.length;i++){
var td=rows[i].querySelector('td.visible-with-data');
var key=td?td.id:'';
if(td&&td.classList.contains('visible-with-data')&&feature.properties[key]==null){rows[i].parentNode.removeChild(rows[i])}
}
return tempDiv.innerHTML;
}

function addClassToPopupIfMedia(content,popup){
var tempDiv=document.createElement('div');
tempDiv.innerHTML=content;
var imgTd=tempDiv.querySelector('td img');
if(imgTd){
var src=imgTd.getAttribute('src');
if(/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)){
popup._contentNode.classList.add('media');
var img=popup._contentNode.querySelector('td img');
if(img){
if(img.complete&&img.naturalHeight>0){popup.update()}
else{img.addEventListener('load',function(){popup.update()});img.addEventListener('error',function(){popup.update()})}
}
}else if(/\.(mp3|wav|ogg|aac)$/i.test(src)){
var audio=document.createElement('audio');
audio.controls=true;
audio.src=src;
imgTd.parentNode.replaceChild(audio,imgTd);
popup._contentNode.classList.add('media');
setTimeout(function(){popup.setContent(tempDiv.innerHTML);popup.update()},10);
}else if(/\.(mp4|webm|ogg|mov)$/i.test(src)){
var video=document.createElement('video');
video.controls=true;
video.src=src;
video.style.width="400px";
video.style.height="300px";
video.style.maxHeight="60vh";
video.style.maxWidth="60vw";
imgTd.parentNode.replaceChild(video,imgTd);
popup._contentNode.classList.add('media');
video.addEventListener('loadedmetadata',function(){popup.update()});
setTimeout(function(){popup.setContent(tempDiv.innerHTML);popup.update()},10);
}else{popup._contentNode.classList.remove('media')}
}else{popup._contentNode.classList.remove('media')}
}

function keepPsmPopupBelowPageTitle(popup){
if(!popup.isOpen()){return}
var popupElement=popup.getElement();
var pageTitle=document.querySelector('.map-title');
if(!popupElement||!pageTitle){return}
var popupBounds=popupElement.getBoundingClientRect();
var titleBounds=pageTitle.getBoundingClientRect();
var safeTop=titleBounds.bottom+12;
if(popupBounds.top<safeTop){map.panBy([0,popupBounds.top-safeTop],{animate:false})}
}
function schedulePsmPopupPosition(popup){
setTimeout(function(){keepPsmPopupBelowPageTitle(popup)},100);
}

function hasPsmPdfPath(path){
return path!==null&&path!==undefined&&String(path).trim()!==''&&String(path).trim().toLowerCase()!=='null';
}

function preparePsmPdfImage(image){
var scale=Math.min(1,2400/Math.max(image.naturalWidth,image.naturalHeight));
var canvas=document.createElement('canvas');
canvas.width=Math.max(1,Math.round(image.naturalWidth*scale));
canvas.height=Math.max(1,Math.round(image.naturalHeight*scale));
var context=canvas.getContext('2d');
if(!context){throw new Error('Canvas rendering is unavailable')}
context.fillStyle='#fff';
context.fillRect(0,0,canvas.width,canvas.height);
context.drawImage(image,0,0,canvas.width,canvas.height);
var jpegBase64=canvas.toDataURL('image/jpeg',0.92).split(',')[1];
var jpegBinary=window.atob(jpegBase64);
var jpegBytes=new Uint8Array(jpegBinary.length);
for(var byteIndex=0;byteIndex<jpegBinary.length;byteIndex++){jpegBytes[byteIndex]=jpegBinary.charCodeAt(byteIndex)}
return{bytes:jpegBytes,width:canvas.width,height:canvas.height};
}

function loadPsmPdfAssets(feature,callback){
var assets={sketch:null,photo:null};
var pendingAssets=0;
var assetError=null;
function finishIfReady(){
if(pendingAssets===0){callback(assetError?null:assets,assetError)}
}
function loadAsset(path,type){
if(!hasPsmPdfPath(path)){return}
pendingAssets++;
var assetSrc='images/'+String(path).replace(/[\\/:]/g,'_').trim();
var popupImage=null;
var popup=document.querySelector('.leaflet-popup');
if(popup){
var popupImages=popup.querySelectorAll('.psm-image');
for(var popupImageIndex=0;popupImageIndex<popupImages.length;popupImageIndex++){
if(popupImages[popupImageIndex].getAttribute('src')===assetSrc){
popupImage=popupImages[popupImageIndex];
popupImage.loading='eager';
break;
}
}
}
function tryLoadAsset(attempt){
var image=attempt===0&&popupImage?popupImage:new Image();
image.onload=function(){
try{
assets[type]=preparePsmPdfImage(image);
pendingAssets--;
finishIfReady();
}catch(error){
handleAssetError(error,attempt);
}
};
image.onerror=function(){
handleAssetError(new Error('Unable to load the PSM '+type+' attachment'),attempt);
};
if(image!==popupImage){image.src=assetSrc}
else if(image.complete){
if(image.naturalWidth){image.onload()}
else{image.onerror()}
}
}
function handleAssetError(error,attempt){
if(attempt<1){
setTimeout(function(){tryLoadAsset(attempt+1)},150);
return;
}
if(!assetError){assetError=error}
console.error('Unable to prepare the PSM '+type+' for the survey mark PDF:',path,error);
pendingAssets--;
finishIfReady();
}
tryLoadAsset(0);
}
loadAsset(feature.properties['Sketch_Path'],'sketch');
loadAsset(feature.properties['Photo_Path'],'photo');
finishIfReady();
}

function downloadPsmInformationPdf(feature,preparedAssets){
var stationName=String(feature.properties['Station_Name']||'Permanent Survey Mark');
var siteId=String(feature.properties['Site_ID']||'');
var sketchImage=preparedAssets.sketch;
var photoImage=preparedAssets.photo;
function hasPath(path){return hasPsmPdfPath(path)}
function pdfText(value){
return String(value).replace(/[^\x20-\x7E]/g,'?').replace(/[\\()]/g,'\\$&');
}
function getPropertyValue(key){
var value=feature.properties[key];
if(value===null||value===undefined||String(value).trim()===''||String(value).trim().toLowerCase()==='null'){return 'Not recorded'}
return String(value);
}

function createPdf(){
try{
var detailSections=[
{title:'Identification',fields:[['Site ID','Site_ID'],['Superseded Site ID','Site_ID_Superseded'],['Station Name','Station_Name'],['Last Observation','Last_Observation'],['Last Adjustment','Last_Adjustment']]},
{title:'PNG2020 / PNG2020 Zone 55 Coordinates',fields:[['Easting','PNGMG2020_Zone_55_Easting'],['Northing','PNGMG2020_Zone_55_Northing'],['PNG08 2020 Elevation (m)','Elevation_MSL_PNG08_2020_Metres'],['Latitude','PNGMG2020_Latitude_Decimal'],['Longitude','PNGMG2020_Longitude_Decimal'],['Ellipsoid Height (m)','PNGMG2020_Zone_55_Ellipsoid_Height'],['Ground-to-grid scale factor','PNGMG_CSF_Ground_to_Grid']]},
{title:'PNG94 / PNGMG94 Zone 55 Coordinates',fields:[['Easting','PNGMG94_Zone_55_Easting'],['Northing','PNGMG94_Zone_55_Northing'],['Latitude','PNG94_latitude_decimal'],['Longitude','PNG94_longitude_decimal'],['Ellipsoid Height (m)','PNG94_ellipsoid_height_metres']]},
{title:'LAE2020 Coordinates',fields:[['Easting','LAE2020_Easting'],['Northing','LAE2020_Northing'],['Combined scale factor','Combined_SF_Ground_to_Grid']]},
{title:'PNG2020 Positional Uncertainty (95% CI)',fields:[['Easting uncertainty','E_Positional_Uncertainty_95CI'],['Northing uncertainty','N_Positional_Uncertainty_95CI'],['Height uncertainty','h_Positional_Uncertainty_95CI']]},
{title:'PNG2020 Velocity Information',fields:[['Velocity type','Velocity_Type_Estimated'],['Topocentric E velocity (mm/yr)','Topocentric_E_Velocity_mmyr-1'],['Topocentric N velocity (mm/yr)','Topocentric_N_Velocity_mmyr-1'],['Topocentric U velocity (mm/yr)','Topocentric_U_Velocity_mmyr-1'],['E velocity uncertainty (95% CI, mm/yr)','E_Velocity_Uncertainty_95CI_mmyr-1'],['N velocity uncertainty (95% CI, mm/yr)','N_Velocity_Uncertainty_95CI_mmyr-1'],['U velocity uncertainty (95% CI, mm/yr)','U_Velocity_Uncertainty_95CI_mmyr-1']]}
];
var detailLines=[];
for(var sectionIndex=0;sectionIndex<detailSections.length;sectionIndex++){
var section=detailSections[sectionIndex];
detailLines.push({type:'section',text:section.title});
for(var fieldIndex=0;fieldIndex<section.fields.length;fieldIndex++){
var field=section.fields[fieldIndex];
detailLines.push({type:'field',text:field[0]+': '+getPropertyValue(field[1])});
}
}
function wrapPdfLine(text,maxLength){
var words=pdfText(text).split(/\s+/);
var wrapped=[];
var current='';
for(var wordIndex=0;wordIndex<words.length;wordIndex++){
var word=words[wordIndex];
while(word.length>maxLength){
if(current){wrapped.push(current);current=''}
wrapped.push(word.slice(0,maxLength));
word=word.slice(maxLength);
}
if(current&&current.length+word.length+1>maxLength){wrapped.push(current);current=word}
else{current+=(current?' ':'')+word}
}
if(current||!wrapped.length){wrapped.push(current)}
return wrapped;
}
var pdfPages=[];
var detailPageContent='';
var detailY=790;
function startDetailPage(){
detailPageContent='BT /F2 15 Tf 42 805 Td ('+pdfText(stationName)+' - Overall PSM Information) Tj ET\n'+
'BT /F1 9 Tf 42 788 Td (Site ID: '+pdfText(siteId)+') Tj ET\n';
detailY=770;
}
function finishDetailPage(){
if(detailPageContent){pdfPages.push({content:detailPageContent,width:595.28,height:841.89});detailPageContent=''}
}
startDetailPage();
for(var detailIndex=0;detailIndex<detailLines.length;detailIndex++){
var detailLine=detailLines[detailIndex];
if(detailLine.type==='section'){
if(detailY<80){finishDetailPage();startDetailPage()}
detailY-=5;
detailPageContent+='BT /F2 9 Tf 42 '+detailY+' Td ('+pdfText(detailLine.text)+') Tj ET\n';
detailY-=12;
}else{
var wrappedLines=wrapPdfLine(detailLine.text,108);
for(var wrappedIndex=0;wrappedIndex<wrappedLines.length;wrappedIndex++){
if(detailY<54){finishDetailPage();startDetailPage()}
detailPageContent+='BT /F1 8 Tf 52 '+detailY+' Td ('+wrappedLines[wrappedIndex]+') Tj ET\n';
detailY-=10;
}
}
}
finishDetailPage();

var images=[];
function addInformationPage(preparedImage,title,fields,bottomFields){
var availableFields=[];
for(var availableFieldIndex=0;availableFieldIndex<fields.length;availableFieldIndex++){
if(hasPath(feature.properties[fields[availableFieldIndex][1]])){availableFields.push(fields[availableFieldIndex])}
}
if(!preparedImage&&!availableFields.length){return}
var pageWidth=595.28;
var pageHeight=841.89;
var margin=42;
var availableWidth=pageWidth-margin*2;
var content='BT /F2 16 Tf '+margin+' 800 Td ('+pdfText(stationName)+' - '+pdfText(title)+') Tj ET\n'+
'BT /F1 9 Tf '+margin+' 782 Td (Site ID: '+pdfText(siteId)+') Tj ET\n';
var y=758;
for(var fieldIndex=0;fieldIndex<availableFields.length;fieldIndex++){
var wrappedLines=wrapPdfLine(availableFields[fieldIndex][0]+': '+getPropertyValue(availableFields[fieldIndex][1]),96);
for(var lineIndex=0;lineIndex<wrappedLines.length;lineIndex++){
content+='BT /F1 9 Tf '+margin+' '+y+' Td ('+wrappedLines[lineIndex]+') Tj ET\n';
y-=13;
}
}
var bottomLines=[];
var bottomTitle='';
for(var bottomFieldIndex=0;bottomFields&&bottomFieldIndex<bottomFields.length;bottomFieldIndex++){
var bottomField=bottomFields[bottomFieldIndex];
bottomTitle+=(bottomTitle?' / ':'')+pdfText(bottomField[0]).toUpperCase();
var wrappedBottomLines=wrapPdfLine(getPropertyValue(bottomField[1]),96);
for(var bottomLineIndex=0;bottomLineIndex<wrappedBottomLines.length;bottomLineIndex++){bottomLines.push(wrappedBottomLines[bottomLineIndex])}
}
var bottomPanelHeight=bottomLines.length?34+bottomLines.length*11:0;
function drawBottomPanel(){
if(!bottomLines.length){return}
content+='q 0.98 0.96 0.88 rg '+margin+' '+margin+' '+availableWidth+' '+bottomPanelHeight+' re f Q\n';
content+='q 0.65 G 0.8 w '+margin+' '+margin+' '+availableWidth+' '+bottomPanelHeight+' re S Q\n';
content+='BT /F2 10 Tf '+(margin+12)+' '+(margin+bottomPanelHeight-15)+' Td ('+bottomTitle+') Tj ET\n';
var bottomY=margin+bottomPanelHeight-30;
for(var bottomTextIndex=0;bottomTextIndex<bottomLines.length;bottomTextIndex++){
content+='BT /F1 9 Tf '+(margin+12)+' '+bottomY+' Td ('+bottomLines[bottomTextIndex]+') Tj ET\n';
bottomY-=11;
}
}
if(preparedImage){
var imageName='Im'+images.length;
var imageTop=y-12;
var bottomTextTop=margin+bottomPanelHeight;
var imageBottom=bottomLines.length?bottomTextTop+18:margin;
var availableHeight=Math.max(1,imageTop-imageBottom);
var scale=Math.min(availableWidth/preparedImage.width,availableHeight/preparedImage.height);
var renderedWidth=preparedImage.width*scale;
var renderedHeight=preparedImage.height*scale;
var x=(pageWidth-renderedWidth)/2;
var imageY=imageBottom+(availableHeight-renderedHeight)/2;
content+='q '+renderedWidth.toFixed(2)+' 0 0 '+renderedHeight.toFixed(2)+' '+x.toFixed(2)+' '+imageY.toFixed(2)+' cm /'+imageName+' Do Q\n';

var longestLength=0;
for(var segmentIndex=1;segmentIndex<coordinates.length;segmentIndex++){
var startPoint=coordinates[segmentIndex-1];
var endPoint=coordinates[segmentIndex];
var middleLatitude=(startPoint.lat+endPoint.lat)/2*Math.PI/180;
var segmentX=(endPoint.lng-startPoint.lng)*Math.cos(middleLatitude);
var segmentY=-(endPoint.lat-startPoint.lat);
var segmentLength=Math.sqrt(segmentX*segmentX+segmentY*segmentY);
if(segmentLength>longestLength){longestLength=segmentLength;longestSegment={x:segmentX,y:segmentY}}
}
var label=L.DomUtil.create('span');
label.textContent=roadName;
if(longestSegment){
var angle=Math.atan2(longestSegment.y,longestSegment.x)*180/Math.PI;
if(angle>90||angle< -90){angle+=180}
label.style.display='inline-block';
label.style.transform='rotate('+angle.toFixed(1)+'deg)';
}

var hasCollision=false;

hasCollision=true;
break;
}
}
if(!hasCollision){
roadTooltip.style.visibility='visible';
occupied.push(roadBounds);
}
}
});

});
